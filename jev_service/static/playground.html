<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnotes · Practice shop</title><style>body{font:17px system-ui;color:#243d33;background:#f4f5ed;max-width:850px;padding:45px;margin:auto}header{font-size:14px;letter-spacing:2px;border-bottom:1px solid #c7d0bf;padding-bottom:22px}h1{font-size:43px;font-weight:500;letter-spacing:-2px;margin-bottom:10px}p{color:#58675b;line-height:1.7}form{display:flex;gap:10px;margin:30px 0}input,button{font:inherit;padding:14px;border:1px solid #b6c2ae;border-radius:5px}input{flex:1}button{background:#264637;color:white;cursor:pointer}article{background:white;padding:22px;margin:18px 0;border:1px solid #d4dccb;border-radius:8px}a{color:#385d32}h2{font-size:25px}#detail{background:white;padding:25px;border-radius:8px}summary{cursor:pointer;padding:12px 0}</style></head><body><header>FIELDNOTES / THE PRACTICE SHOP</header><h1>A little more outside.</h1><p>Find well-made gear for everyday adventures. This is a local demo catalog; nothing can be purchased.</p><form><input name="q" aria-label="Search products" placeholder="Search products"><button>Search</button></form><section id="products"></section><section id="detail" hidden></section><script>
const products=[{id:'trail',name:'Trail daypack',description:'A light, weather-resistant backpack for day hikes.',price:'$89',details:'Capacity: 22 liters. Weight: 640 grams. Price: $89.'},{id:'camp',name:'Camp mug',description:'An insulated mug for your morning coffee.',price:'$24',details:'Capacity: 350 milliliters. Price: $24.'},{id:'ridge',name:'Ridge rain jacket',description:'A packable shell for changing weather.',price:'$129',details:'Weight: 310 grams. Price: $129.'}];
const query=new URLSearchParams(location.search), selected=products.find(p=>p.id===query.get('product'));
document.querySelector('input').value=query.get('q')||'';
if(selected){document.querySelector('#detail').hidden=false;document.querySelector('#detail').innerHTML='<a href="?">← All products</a><h2>'+selected.name+'</h2><p>'+selected.description+'</p><strong>'+selected.price+'</strong><details><summary>Specifications</summary><p>'+selected.details+'</p><p>Practice task complete.</p></details>';}else{const match=(query.get('q')||'').toLowerCase();const found=products.filter(p=>(p.name+' '+p.description).toLowerCase().includes(match));document.querySelector('#products').innerHTML=found.map(p=>'<article><h2><a href="?product='+p.id+'">'+p.name+'</a></h2><p>'+p.description+'</p><strong>'+p.price+'</strong></article>').join('')||'<p>No products found. Try “backpack”.</p>';}
</script></body></html>
