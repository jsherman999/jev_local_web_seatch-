[project]
name = "jev-browser-service"
version = "0.1.0"
description = "Local Jev browser jobs API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-dotenv>=1,<2", "jev-ultrafast"]

[tool.uv.sources]
jev-ultrafast = { path = "vendor/jev-ultrafast" }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
